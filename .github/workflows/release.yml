name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[build]"
      - name: Build exe
        run: >
          pyinstaller --noconfirm --clean --onefile --name wavc
          --collect-all pyaudiowpatch --hidden-import _portaudiowpatch
          scripts/entry.py --paths src
      - name: Smoke test exe
        run: |
          .\dist\wavc.exe --version
          .\dist\wavc.exe --demo --frames 30 --fps 240
      - uses: actions/upload-artifact@v4
        with:
          name: wavc-windows-x64
          path: dist/wavc.exe
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/wavc.exe
          generate_release_notes: true
