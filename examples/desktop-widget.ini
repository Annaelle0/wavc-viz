; A borderless, always-on-top, see-through desktop widget (Windows).
; Run with:  wavc -c examples/desktop-widget.ini
; Drag with the left mouse button, right-click to close.
[output]
method = gui
bar_width = 2
bar_spacing = 1

[color]
theme = synthwave
gradient_direction = horizontal

[gui]
width = 700
height = 180
borderless = true
topmost = true
transparent = true
