; A moody preset: stereo, mirrored bars, custom gradient, dark background.
; Run with:  wavc -c examples/neon-mirror.ini
[general]
bars = 0
framerate = 60

[output]
orientation = mirror
channels = stereo
bar_width = 1
bar_spacing = 1

[color]
gradient = #ff0080, #ff8c00, #ffee00
gradient_direction = vertical
background = #0a0a12

[smoothing]
noise_reduction = 80
monstercat = 1.5
